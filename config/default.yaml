# 富途量化数据平台配置
opend:
  host: "127.0.0.1"
  port: 11111
  is_encrypt: false
  rsa_key_path: ""
  # OpenD 可执行文件路径，留空则自动在 FutuOpenD/ 目录下查找
  exe_path: ""
  # 账号密码请勿写在这里！在 GUI「连接管理」中填写并勾选「记住」，
  # 会保存到 config/local.yaml（已 gitignore，不会提交）
  account: ""
  pwd_md5: ""

storage:
  db_type: "sqlite"
  sqlite_path: "./data/futu_quant.db"
  parquet_dir: "./data/export"
  export_csv: false
  csv_dir: "./data/export/csv"

kline:
  default_types: ["K_1M", "K_5M", "K_60M", "K_DAY"]
  max_count_per_request: 1000
  request_interval: 0.5
  lookback_days:
    K_1M: 90
    K_5M: 180
    K_15M: 365
    K_30M: 365
    K_60M: 730
    K_DAY: 3650

tick:
  enabled: true
  retention_days: 365
  collect_interval: 0.3
  max_count: 1000

watchlist:
  US: []
  HK: []
  SH: []
  SZ: []

scheduler:
  auto_update: false
  daily_update_time: "16:30"
  realtime_collect: false

logging:
  level: "INFO"
  file: "./logs/futu_quant.log"
  rotation: "7 days"
  max_size: "50 MB"

analysis:
  model_dir: "./models"
  feature_window: 60

realtime:
  refresh_interval: 3000
  max_stocks: 50

paper_trading:
  default_initial_cash: 1000000
  currency: "CNY"
  fx_rate:
    HKD_CNY: 0.92
    USD_CNY: 7.25
  fees:
    SH:
      commission_rate: 0.00025
      min_commission: 5
      stamp_tax_rate: 0.001
      transfer_fee_rate: 0.000002
    SZ:
      commission_rate: 0.00025
      min_commission: 5
      stamp_tax_rate: 0.001
    HK:
      commission_rate: 0.0003
      min_commission: 3
      platform_fee: 15
      stamp_duty_rate: 0.0013
      trading_fee_rate: 0.00005
      settlement_fee_rate: 0.00002
    US:
      commission_per_share: 0.005
      min_commission: 1
      sec_fee_rate: 0.0000278
      taf_fee_per_share: 0.000166

strategy:
  eval_interval: 5000
  max_strategies: 20
  backtest_default_cash: 1000000
